# Pubblicazione da tag vX.Y.Z (SPECIFICHE.md §10), con le stesse versioni su npm e pub.dev.
# Prerequisiti, una volta sola (vedi docs/rilascio.md):
#   - npm: prima pubblicazione manuale, poi trusted publisher configurato su questo workflow;
#   - pub.dev: prima pubblicazione manuale, poi automated publishing da GitHub con tag pattern v{{version}}.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verifica versione e controlli completi
    runs-on: ubuntu-24.04
    outputs:
      npm_published: ${{ steps.registries.outputs.npm_published }}
      pub_published: ${{ steps.registries.outputs.pub_published }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: pnpm install --frozen-lockfile
      - run: dart pub get
        working-directory: packages/dart

      - name: Il tag coincide con la versione dei pacchetti
        run: |
          version="$(node -p "require('./packages/js/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME diverso dalla versione $version"
            exit 1
          fi

      - run: pnpm check
      - run: pnpm parity --expectations

      - name: Build e smoke test dei pacchetti
        run: |
          pnpm --filter italian-profanity build
          node tools/smoke.mjs
          node tools/smoke-browser.mjs

      - name: Verifica del pacchetto Dart
        run: dart pub publish --dry-run
        working-directory: packages/dart

      - name: Verifica le versioni già pubblicate
        id: registries
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/js/package.json', 'utf8'));
          const registries = [
            ['npm', `https://registry.npmjs.org/italian-profanity/${encodeURIComponent(version)}`],
            ['pub', `https://pub.dev/api/packages/italian_profanity/versions/${encodeURIComponent(version)}`],
          ];
          for (const [name, url] of registries) {
            const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
            if (response.status !== 200 && response.status !== 404) {
              throw new Error(`${name}: HTTP ${response.status}`);
            }
            const published = response.status === 200;
            if (published && (await response.json()).version !== version) {
              throw new Error(`${name}: versione inattesa`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}_published=${published}\n`);
          }
          NODE

  npm:
    name: Pubblica su npm
    needs: verify
    if: needs.verify.outputs.npm_published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter italian-profanity build
      - name: Pubblica con il tag npm appropriato
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="latest"
          if [[ "$version" == *-* ]]; then
            tag="${version#*-}"
            tag="${tag%%.*}"
          fi
          npm publish --provenance --access public --tag "$tag"
        working-directory: packages/js

  pub:
    name: Pubblica su pub.dev
    needs: verify
    if: needs.verify.outputs.pub_published != 'true'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/dart
