name: Website (Astro + GitHub Pages)

on:
  pull_request:
    paths:
      - "website/**"
      - "tools/update-download-stats*"
      - ".github/workflows/website-pages.yml"
  push:
    branches: [master]
    paths:
      - "website/**"
      - "tools/update-download-stats*"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: website-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test download snapshot accounting
        run: node --test tools/update-download-stats.test.mjs
      - name: Refresh package download totals
        if: github.event_name != 'pull_request'
        run: node tools/update-download-stats.mjs
      - name: Preserve daily download history
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- website/public/stats/downloads.json stats/downloads-history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website/public/stats/downloads.json stats/downloads-history.json
            git commit -m "Aggiorna storico download pacchetti"
            git push
          fi
      - name: Install isolated website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Astro production build
        working-directory: website
        env:
          # Custom domain at the root by default; the repository variables
          # WEBSITE_SITE_URL and WEBSITE_SITE_BASE can override both.
          SITE_URL: ${{ vars.WEBSITE_SITE_URL || 'https://italian-profanity.eliazavatta.it' }}
          SITE_BASE: ${{ vars.WEBSITE_SITE_BASE || '/' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
