name: Website (Astro + GitHub Pages)

on:
  pull_request:
    paths:
      - "website/**"
      - "tools/update-download-stats*"
      - ".github/workflows/website-pages.yml"
  push:
    branches: [master]
    paths:
      - "website/**"
      - "tools/update-download-stats*"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: website-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test download snapshot accounting
        run: node --test tools/update-download-stats.test.mjs
      - name: Restore previous snapshots from the data branch
        if: github.event_name != 'pull_request'
        run: |
          if git fetch origin refs/heads/download-stats:refs/remotes/origin/download-stats; then
            git show refs/remotes/origin/download-stats:stats/downloads-history.json > stats/downloads-history.json
            git show refs/remotes/origin/download-stats:website/public/stats/downloads.json > website/public/stats/downloads.json
          else
            echo "No archive branch yet; initializing from the repository."
          fi
      - name: Refresh package download totals
        if: github.event_name != 'pull_request'
        run: node tools/update-download-stats.mjs
      - name: Preserve history on the unprotected data branch
        if: github.event_name != 'pull_request'
        run: |
          SNAPSHOT_DIR="$RUNNER_TEMP/download-stats-worktree"
          if git show-ref --quiet refs/remotes/origin/download-stats; then
            git worktree add --detach "$SNAPSHOT_DIR" refs/remotes/origin/download-stats
          else
            git worktree add --detach "$SNAPSHOT_DIR" HEAD
          fi
          cp website/public/stats/downloads.json "$SNAPSHOT_DIR/website/public/stats/downloads.json"
          cp stats/downloads-history.json "$SNAPSHOT_DIR/stats/downloads-history.json"
          cd "$SNAPSHOT_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/stats/downloads.json stats/downloads-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna snapshot giornalieri dei download"
            git push origin HEAD:refs/heads/download-stats
          fi
      - name: Install isolated website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Astro production build
        working-directory: website
        env:
          # Custom domain at the root by default; the repository variables
          # WEBSITE_SITE_URL and WEBSITE_SITE_BASE can override both.
          SITE_URL: ${{ vars.WEBSITE_SITE_URL || 'https://italian-profanity.eliazavatta.it' }}
          SITE_BASE: ${{ vars.WEBSITE_SITE_BASE || '/' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
